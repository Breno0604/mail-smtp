<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de Ordem &mdash; Campos de Retorno</title>
<style>
  :root {
    --primary: #1e40af;
    --primary-light: #dbeafe;
    --success: #15803d;
    --success-bg: #dcfce7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
    --warning: #a16207;
    --warning-bg: #fef9c3;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    line-height: 1.6;
    padding: 2rem;
  }

  /* ── Container ── */
  .container { max-width: 1200px; margin: 0 auto; }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 2.5rem 1rem;
    background: linear-gradient(135deg, #1e3a5f, #1e40af);
    color: #fff;
    border-radius: 12px;
    margin-bottom: 2rem;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  header h1 { font-size: 1.8rem; margin-bottom: .5rem; }
  header p { opacity: .85; font-size: .95rem; }

  /* ── Stats row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 1.25rem;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border-top: 4px solid var(--primary);
  }
  .stat-card .num {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
  }
  .stat-card .label {
    font-size: .85rem;
    color: var(--gray-500);
    margin-top: .25rem;
  }
  .stat-card.success { border-top-color: var(--success); }
  .stat-card.success .num { color: var(--success); }
  .stat-card.danger { border-top-color: var(--danger); }
  .stat-card.danger .num { color: var(--danger); }

  /* ── Filter / search ── */
  .filter-bar {
    background: #fff;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
  }
  .filter-bar label { font-weight: 600; font-size: .9rem; color: var(--gray-700); }
  .filter-bar input, .filter-bar select {
    padding: .5rem .75rem;
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    font-size: .9rem;
    flex: 1 1 220px;
    min-width: 0;
  }
  .filter-bar input:focus, .filter-bar select:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
  }

  /* ── Ordem card ── */
  .ordem-card {
    background: #fff;
    border-radius: 10px;
    margin-bottom: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .ordem-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }

  .ordem-header {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: 1rem 1.25rem;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .ordem-header:hover { background: var(--gray-50); }

  .ordem-header .index {
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: .75rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .index.has-retorno { background: var(--success); }
  .index.no-retorno { background: var(--gray-500); }

  .ordem-header .name {
    flex: 1;
    font-weight: 600;
    font-size: 1rem;
  }

  .ordem-header .badge {
    font-size: .75rem;
    font-weight: 600;
    padding: .25rem .65rem;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .badge.has-retorno {
    background: var(--success-bg);
    color: var(--success);
  }
  .badge.no-retorno {
    background: var(--gray-200);
    color: var(--gray-500);
  }

  .ordem-header .toggle-icon {
    font-size: .8rem;
    color: var(--gray-500);
    transition: transform .25s;
    flex-shrink: 0;
  }
  .ordem-card.open .toggle-icon { transform: rotate(180deg); }

  /* ── Retorno body ── */
  .ordem-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .ordem-card.open .ordem-body {
    max-height: 2000px;
  }
  .ordem-body-inner {
    padding: 0 1.25rem 1.25rem;
    border-top: 1px solid var(--gray-200);
  }

  .field-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: .75rem;
    font-size: .88rem;
  }
  .field-table th {
    text-align: left;
    font-weight: 600;
    color: var(--gray-500);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: .5rem .6rem;
    border-bottom: 2px solid var(--gray-200);
  }
  .field-table td {
    padding: .5rem .6rem;
    border-bottom: 1px solid var(--gray-100);
    vertical-align: top;
  }
  .field-table tr:last-child td { border-bottom: none; }

  .field-table .field-name {
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: .82rem;
    color: var(--primary);
    word-break: break-all;
  }
  .field-table .field-label {
    font-weight: 500;
  }
  .field-table .field-type {
    display: inline-block;
    font-size: .72rem;
    padding: .15rem .45rem;
    border-radius: 4px;
    background: var(--gray-100);
    color: var(--gray-700);
  }
  .field-table .field-cond {
    font-size: .78rem;
    color: var(--warning);
    background: var(--warning-bg);
    padding: .15rem .45rem;
    border-radius: 4px;
    white-space: nowrap;
  }
  .field-table .field-negado {
    font-size: .78rem;
    color: var(--danger);
    background: var(--danger-bg);
    padding: .15rem .45rem;
    border-radius: 4px;
    white-space: nowrap;
  }
  .field-table .field-opcoes {
    font-size: .78rem;
    color: var(--gray-700);
  }
  .field-table .field-opcoes code {
    display: inline-block;
    background: var(--gray-50);
    padding: .1rem .3rem;
    border-radius: 3px;
    font-size: .75rem;
    margin: .1rem .15rem;
  }

  /* ── Fallback info ── */
  .fallback-note {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-top: .75rem;
    padding: .6rem .9rem;
    background: var(--gray-50);
    border-radius: 6px;
    font-size: .85rem;
    color: var(--gray-500);
  }

  /* ── Summary section ── */
  .summary-section {
    background: #fff;
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .summary-section h2 {
    font-size: 1.15rem;
    margin-bottom: 1rem;
    padding-bottom: .5rem;
    border-bottom: 2px solid var(--gray-200);
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: .6rem;
  }
  .summary-item {
    padding: .4rem .7rem;
    border-radius: 6px;
    font-size: .85rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .summary-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.green { background: var(--success); }
  .dot.gray { background: var(--gray-300); }
  .summary-item .count-badge {
    margin-left: auto;
    font-size: .72rem;
    font-weight: 600;
    padding: .1rem .45rem;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .count-badge.green-badge {
    background: var(--success-bg);
    color: var(--success);
  }
  .count-badge.gray-badge {
    background: var(--gray-200);
    color: var(--gray-500);
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    body { padding: 1rem; }
    header h1 { font-size: 1.3rem; }
    .ordem-header { flex-wrap: wrap; }
    .field-table { font-size: .82rem; }
    .field-table td, .field-table th { padding: .4rem .4rem; }
  }
</style>
</head>

<div class="container">

  <!-- ═══ HEADER ═══ -->
  <header>

</div>

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════

function getFields(tipo) {
  return retornoFieldsByTipo[tipo] || retornoFieldsByTipo["default"];
}

function temCustom(tipo) {
  return tipo in retornoFieldsByTipo;
}

function formatCondicional(campo) {
  if (!campo.condicional) return "";
  const c = campo.condicional;
  const valor = Array.isArray(c.valor) ? c.valor.join(" ou ") : c.valor;
  const base = `Exibido quando <strong>${c.campoRef}</strong> = ${valor}`;
  if (c.negado) {
    return `<span class="field-negado">${base} (NEGAÇÃO)</span>`;
  }
  return `<span class="field-cond">${base}</span>`;
}

function formatOpcoes(campo) {
  if (!campo.opcoes || campo.opcoes.length === 0) return "";
  return campo.opcoes.map(o => `<code>${o}</code>`).join("");
}

function renderFieldRow(campo, index) {
  return `<tr>
    <td><span class="field-name">${campo.nome}</span></td>
    <td><span class="field-label">${campo.label}</span></td>
    <td><span class="field-type">${campo.tipo}</span></td>
    <td>${formatCondicional(campo)}</td>
    <td><span class="field-opcoes">${formatOpcoes(campo)}</span></td>
  </tr>`;
}

function renderOrdem(tipo, idx) {
  const fields = getFields(tipo);
  const hasCustom = temCustom(tipo);
  const isDefault = !hasCustom || (tipo in retornoFieldsByTipo && retornoFieldsByTipo[tipo] === undefined);
  const isDefaultFallback = !hasCustom;
  const fieldCount = fields.length;

  const headerClass = hasCustom ? "has-retorno" : "no-retorno";
  let tableRows = fields.map((f, i) => renderFieldRow(f, i)).join("");

  let fallbackHtml = "";
  if (isDefaultFallback) {
    fallbackHtml = `<div class="fallback-note">
      <span style="font-size:1.1rem;">&#128196;</span>
      <span>Usa o fallback <strong>default</strong> &mdash; apenas o campo "Descrição do Serviço" genérico.</span>
    </div>`;
  }

  return `<div class="ordem-card ${hasCustom ? 'open' : ''}" data-tipo="${tipo}" data-has="${hasCustom ? 'com' : 'sem'}">
    <div class="ordem-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="index ${headerClass}">${idx + 1}</span>
      <span class="name">${tipo}</span>
      <span class="badge ${headerClass}">${hasCustom ? fieldCount + ' campo(s)' : 'Default'}</span>
      <span class="toggle-icon">&#9660;</span>
    </div>
    <div class="ordem-body">
      <div class="ordem-body-inner">
        ${hasCustom ? `
        <table class="field-table">
          <thead>
            <tr>
              <th style="width:22%">Nome</th>
              <th style="width:22%">Label</th>
              <th style="width:8%">Tipo</th>
              <th style="width:28%">Condicional</th>
              <th style="width:20%">Opções</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
          </tbody>
        </table>` : fallbackHtml}
      </div>
    </div>
  </div>`;
}

function renderAll() {
  const lista = document.getElementById("lista");
  lista.innerHTML = TIPOS_ORDEM.map((t, i) => renderOrdem(t, i)).join("");

  // Stats
  const com = TIPOS_ORDEM.filter(t => temCustom(t)).length;
  const sem = TIPOS_ORDEM.length - com;
  document.getElementById("totalComRetorno").textContent = com;
  document.getElementById("totalSemRetorno").textContent = sem;

  const totalCampos = TIPOS_ORDEM.reduce((acc, t) => acc + getFields(t).length, 0);
  document.getElementById("totalCampos").textContent = totalCampos;

  document.getElementById("dataGeracao").textContent = new Date().toLocaleString("pt-BR");
}

// ═══════════════════════════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════════════════════════

function aplicarFiltro() {
  const nome = document.getElementById("filterNome").value.toLowerCase().trim();
  const status = document.getElementById("filterStatus").value;

  document.querySelectorAll(".ordem-card").forEach(card => {
    const tipo = card.getAttribute("data-tipo").toLowerCase();
    const has = card.getAttribute("data-has");

    const matchNome = !nome || tipo.includes(nome);
    const matchStatus = status === "todos" || has === status;

    card.style.display = (matchNome && matchStatus) ? "" : "none";
  });
}

// ═══════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════

renderAll();
</script>
