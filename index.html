<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar Email</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-5">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Enviar Email</h1>
    <form id="emailForm">
      <label for="subject" class="block mb-1 font-semibold text-gray-600 text-sm">Assunto</label>
      <input type="text" id="subject" name="subject" required class="w-full px-2.5 py-2 mb-4 border border-gray-300 rounded-md text-base" />

      <label for="text" class="block mb-1 font-semibold text-gray-600 text-sm">Corpo</label>
      <textarea id="text" name="text" rows="5" class="w-full px-2.5 py-2 mb-4 border border-gray-300 rounded-md text-base"></textarea>

      <label for="attachments" class="block mb-1 font-semibold text-gray-600 text-sm">Anexos (imagens, máx. 12)</label>
      <input type="file" id="attachments" name="attachments" multiple accept="image/*" class="w-full mb-4 text-sm" />

      <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white rounded-md text-base cursor-pointer hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">Enviar</button>
      <div id="status" class="mt-4 py-2 px-3 rounded-md text-sm text-center"></div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
